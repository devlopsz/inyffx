<!doctype html>
<html lang="pt-BR" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#07100f" />
    <meta
      name="description"
      content="InyffX transforma seu modo carreira de futebol em um universo vivo de roleplay, memória e narrativa."
    />
    <meta property="og:title" content="InyffX — Sua carreira. Seu universo." />
    <meta
      property="og:description"
      content="A camada de vida, narrativa e memória que continua quando o apito final toca."
    />
    <meta property="og:type" content="website" />
    <title>InyffX — Sua carreira. Seu universo.</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#mainContent">Pular para o conteúdo</a>

    <svg class="svg-sprite" aria-hidden="true">
      <symbol id="i-home" viewBox="0 0 24 24">
        <path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1Z" />
      </symbol>
      <symbol id="i-message" viewBox="0 0 24 24">
        <path d="M20 15a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h9a4 4 0 0 1 4 4Z" />
        <path d="M8 9h8M8 13h5" />
      </symbol>
      <symbol id="i-whistle" viewBox="0 0 24 24">
        <path d="M14 8a5 5 0 1 0 0 8h3a4 4 0 0 0 0-8Z" />
        <path d="M14 8V5h5M4 12H2m3.2-4.8L3.8 5.8m1.4 11L3.8 18.2" />
      </symbol>
      <symbol id="i-timeline" viewBox="0 0 24 24">
        <path d="M5 3v18M5 7h7M5 12h12M5 17h9" />
        <circle cx="5" cy="7" r="2" /><circle cx="5" cy="12" r="2" /><circle cx="5" cy="17" r="2" />
      </symbol>
      <symbol id="i-users" viewBox="0 0 24 24">
        <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
        <circle cx="9" cy="7" r="4" />
        <path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75" />
      </symbol>
      <symbol id="i-orbit" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="3" />
        <path d="M19.4 15c1.8 3.1 1.7 5.4.3 6.2-2.1 1.2-7.5-2.4-12-8S.2 2.8 2.3 1.6C4.4.4 9.8 4 14.5 9.2c2.1 2.3 3.7 4.6 4.9 5.8Z" transform="rotate(-28 12 12)" />
        <path d="M19.4 15c1.8 3.1 1.7 5.4.3 6.2-2.1 1.2-7.5-2.4-12-8S.2 2.8 2.3 1.6C4.4.4 9.8 4 14.5 9.2c2.1 2.3 3.7 4.6 4.9 5.8Z" transform="rotate(92 12 12)" />
      </symbol>
      <symbol id="i-search" viewBox="0 0 24 24">
        <circle cx="11" cy="11" r="7" /><path d="m20 20-4-4" />
      </symbol>
      <symbol id="i-bell" viewBox="0 0 24 24">
        <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4" />
      </symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" /></symbol>
      <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6" /></symbol>
      <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m8 10 4 4 4-4" /></symbol>
      <symbol id="i-sun" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.66 6.34l1.41-1.41" />
      </symbol>
      <symbol id="i-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z" /></symbol>
      <symbol id="i-play" viewBox="0 0 24 24"><path d="m8 5 11 7-11 7Z" /></symbol>
      <symbol id="i-pause" viewBox="0 0 24 24"><path d="M9 5v14M15 5v14" /></symbol>
      <symbol id="i-lock" viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="11" rx="2" /><path d="M8 10V7a4 4 0 0 1 8 0v3" /></symbol>
      <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 16V4m0 0L7 9m5-5 5 5M4 15v5h16v-5" /></symbol>
      <symbol id="i-send" viewBox="0 0 24 24"><path d="m22 2-7 20-4-9-9-4Z" /><path d="M22 2 11 13" /></symbol>
      <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2" /><circle cx="8.5" cy="9" r="1.5" /><path d="m21 15-5-5L5 20" /></symbol>
      <symbol id="i-dice" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4" /><circle cx="8" cy="8" r="1" /><circle cx="16" cy="8" r="1" /><circle cx="12" cy="12" r="1" /><circle cx="8" cy="16" r="1" /><circle cx="16" cy="16" r="1" /></symbol>
      <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2" /><path d="M16 3v4M8 3v4M3 10h18" /></symbol>
      <symbol id="i-wallet" viewBox="0 0 24 24"><path d="M4 5h15a2 2 0 0 1 2 2v12H4a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2Z" /><path d="M16 11h5v4h-5a2 2 0 0 1 0-4Z" /></symbol>
      <symbol id="i-trophy" viewBox="0 0 24 24"><path d="M8 4h8v5a4 4 0 0 1-8 0ZM12 13v5M8 21h8M9 18h6M8 6H4v2a4 4 0 0 0 4 4M16 6h4v2a4 4 0 0 1-4 4" /></symbol>
      <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1" /><circle cx="12" cy="12" r="1" /><circle cx="19" cy="12" r="1" /></symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18" /></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6" /></symbol>
      <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16" /><circle cx="9" cy="6" r="2" /><circle cx="15" cy="12" r="2" /><circle cx="7" cy="18" r="2" /></symbol>
      <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12m0 0 5-5m-5 5-5-5M4 19v2h16v-2" /></symbol>
      <symbol id="i-spark" viewBox="0 0 24 24"><path d="m12 2 1.7 6.3L20 10l-6.3 1.7L12 18l-1.7-6.3L4 10l6.3-1.7Z" /><path d="m19 17 .7 2.3L22 20l-2.3.7L19 23l-.7-2.3L16 20l2.3-.7Z" /></symbol>
      <symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="12" rx="3" /><path d="M5 11a7 7 0 0 0 14 0M12 18v3M9 21h6" /></symbol>
      <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z" /><circle cx="12" cy="12" r="2.5" /></symbol>
    </svg>

    <div class="ambient ambient-one"></div>
    <div class="ambient ambient-two"></div>

    <div class="app-shell" id="appShell">
      <aside class="sidebar" aria-label="Navegação principal">
        <button class="brand" type="button" data-route="home" aria-label="Ir para o início">
          <span class="brand-mark" aria-hidden="true"><span>i</span><b>X</b></span>
          <span class="brand-word">Inyff<span>X</span></span>
        </button>

        <nav class="side-nav">
          <button class="nav-button active" type="button" data-route="home" data-label="Início">
            <svg><use href="#i-home"></use></svg><span>Início</span>
          </button>
          <button class="nav-button" type="button" data-route="roleplay" data-label="Roleplay">
            <svg><use href="#i-message"></use></svg><span>Roleplay</span><i class="nav-dot"></i>
          </button>
          <button class="nav-button" type="button" data-route="postgame" data-label="Pós-jogo">
            <svg><use href="#i-whistle"></use></svg><span>Pós-jogo</span>
          </button>
          <button class="nav-button" type="button" data-route="canon" data-label="Cânone">
            <svg><use href="#i-timeline"></use></svg><span>Cânone</span>
          </button>
          <button class="nav-button" type="button" data-route="characters" data-label="Personagens">
            <svg><use href="#i-users"></use></svg><span>Personagens</span>
          </button>
          <button class="nav-button" type="button" data-route="universe" data-label="Universo">
            <svg><use href="#i-orbit"></use></svg><span>Universo</span>
          </button>
        </nav>

        <div class="side-footer">
          <button class="icon-button theme-button" type="button" data-action="toggle-theme" aria-label="Alternar tema">
            <svg class="theme-dark-icon"><use href="#i-sun"></use></svg>
            <svg class="theme-light-icon"><use href="#i-moon"></use></svg>
          </button>
          <button class="avatar avatar-caio" type="button" data-action="open-profile" aria-label="Abrir perfil">CA</button>
        </div>
      </aside>

      <section class="workspace">
        <header class="topbar">
          <button class="career-switcher" type="button" data-action="open-career-menu">
            <span class="club-glyph" aria-hidden="true">C</span>
            <span class="career-switcher-copy">
              <small>Carreira ativa</small>
              <strong id="careerSwitcherText">Caio Alexandre · Chelsea</strong>
            </span>
            <svg><use href="#i-chevron"></use></svg>
          </button>

          <div class="topbar-actions">
            <span class="sync-pill"><i></i><span>Cânone sincronizado</span></span>
            <button class="icon-button" type="button" data-action="open-search" aria-label="Buscar">
              <svg><use href="#i-search"></use></svg>
            </button>
            <button class="icon-button notification-button" type="button" data-action="open-notifications" aria-label="Notificações">
              <svg><use href="#i-bell"></use></svg><span>3</span>
            </button>
            <button class="button button-primary topbar-new" type="button" data-action="new-career">
              <svg><use href="#i-plus"></use></svg><span>Nova carreira</span>
            </button>
          </div>
        </header>

        <main id="mainContent" tabindex="-1"></main>
      </section>
    </div>

    <div class="soundtrack" id="soundtrack">
      <button class="soundtrack-play" type="button" data-action="toggle-soundtrack" aria-label="Reproduzir trilha">
        <svg class="play-icon"><use href="#i-play"></use></svg>
        <svg class="pause-icon"><use href="#i-pause"></use></svg>
      </button>
      <div class="album-art" aria-hidden="true"><span>IX</span></div>
      <div class="soundtrack-copy">
        <small>Trilha da carreira</small>
        <strong>Night Drive · InyffX Mix</strong>
      </div>
      <div class="soundtrack-wave" aria-hidden="true">
        <i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i>
      </div>
      <button class="soundtrack-connect" type="button" data-action="connect-spotify">Spotify <span>↗</span></button>
      <button class="icon-button soundtrack-close" type="button" data-action="close-soundtrack" aria-label="Fechar player">
        <svg><use href="#i-close"></use></svg>
      </button>
    </div>

    <nav class="mobile-nav" aria-label="Navegação móvel">
      <button class="mobile-nav-button active" type="button" data-route="home"><svg><use href="#i-home"></use></svg><span>Início</span></button>
      <button class="mobile-nav-button" type="button" data-route="roleplay"><svg><use href="#i-message"></use></svg><span>RP</span></button>
      <button class="mobile-nav-button mobile-action" type="button" data-route="postgame"><span><svg><use href="#i-plus"></use></svg></span><small>Jogo</small></button>
      <button class="mobile-nav-button" type="button" data-route="canon"><svg><use href="#i-timeline"></use></svg><span>Cânone</span></button>
      <button class="mobile-nav-button" type="button" data-route="universe"><svg><use href="#i-orbit"></use></svg><span>Universo</span></button>
    </nav>

    <div id="modalRoot"></div>
    <div class="toast-region" id="toastRegion" aria-live="polite" aria-atomic="true"></div>

    <noscript>
      <div class="noscript">O InyffX precisa de JavaScript habilitado para carregar sua carreira.</div>
    </noscript>
  </body>
</html>
